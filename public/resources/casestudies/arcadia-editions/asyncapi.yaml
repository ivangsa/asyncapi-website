            topicConfiguration:
              cleanup.policy:
                - delete
              retention.ms: 604800
  order-cancelled-event-v1:
    address: orders-checkout.order-cancelled.event.avro.v1
    x-visibility: global
    messages:
      OrderCancelledEvent:
