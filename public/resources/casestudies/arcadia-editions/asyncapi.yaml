                  - 'null'
                  - string
              - name: customerEmail
                type:
                  - 'null'
                  - string
              - name: unavailableItems
                type:
                  type: array
                  items: StockUnavailableItem
                  java-class: java.util.List
    bindings:
      kafka:
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
            - delete
          retention.ms: 604800000
          retention.bytes: 1000000000
          delete.retention.ms: 86400000
          max.message.bytes: 1048588
        x-env-server-overrides:
