operations:
  onOrderCreated:
    action: send
    tags:
      - name: OrdersCheckout
    channel:
      $ref: '#/channels/order-created-event-v1'
    traits:
      - bindings:
          kafka:
            clientId:
              const: orders_checkout
            groupId:
              const: orders_checkout
            x-principal: orders_checkout
  onStockUnavailable:
